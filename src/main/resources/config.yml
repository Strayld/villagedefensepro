# =============================
#   Village Defense Pro - Config
# =============================

database:
  type: SQLITE  # SQLITE (backend local H2) ou MYSQL
  # MySQL uniquement
  host: localhost
  port: 3306
  name: villagedefense
  username: root
  password: ''
  pool-size: 10

network:
  # Active la synchronisation réseau des arènes dans la table MySQL partagée vd_network_arenas.
  # Nécessite database.type: MYSQL (ignoré silencieusement en mode H2 local).
  # Utilisé par le plugin VillageDefenseHub pour découvrir les arènes du réseau.
  enabled: false
  # Identifiant unique de CE serveur tel qu'il apparaîtra dans la table réseau.
  # Doit correspondre exactement au nom du serveur configuré dans BungeeCord/Velocity.
  server-id: "survival-1"
  # Intervalle de synchronisation en secondes (min recommandé : 5).
  sync-interval: 10

hooks:
  vault:
    permissions: true
    economy-sync: false
  bungeecord:
    enabled: false
    # Nom exact du serveur cible sur le proxy pour y renvoyer les joueurs en sortie.
    return-server: ''

village:
  # Nombre de villageois à spawner (= nombre de vies)
  villager-count: 10
  # Rayon de spawn autour du centre (blocs)
  spawn-radius: 8
  # Rayon maximum avant téléportation de retour (blocs)
  villager-radius: 30
  # Intervalle de la tâche de gardiennage (ticks, 40 = 2s)
  keeper-interval: 40

game:
  # Durée du lobby en secondes
  lobby-countdown: 30
  # Durée entre deux vagues normales (secondes)
  between-waves-duration: 15
  # Durée entre deux vagues après un boss (secondes)
  between-boss-waves-duration: 45
  # Nombre de joueurs min pour démarrer
  min-players: 1
  # Nombre de joueurs max par arène
  max-players: 6
  # Difficulté des vagues (multiplicateur de HP/nombre de mobs)
  difficulty-multiplier: 1.0
  # Nombre de lives du village (0 = game over)
  village-lives: 10

waves:
  # Vague spéciale toutes les X vagues normales
  special-wave-interval: 5
  # Vague boss toutes les X vagues
  boss-wave-interval: 10
  # Délai entre chaque spawn de mob (ticks)
  spawn-delay: 10
  # HP de base des zombies (augmente chaque vague)
  base-zombie-hp: 20.0
  hp-increment-per-wave: 5.0
  # Nombre de base de mobs par vague
  base-mob-count: 5
  mob-count-increment: 3

towers:
  # Ticks entre chaque attaque des tours (20 ticks = 1 seconde)
